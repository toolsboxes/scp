<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱 · ToolBox</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--card:#1a1a2e;--border:#2a2a4a;--accent:#6366f1;--accent2:#ec4899;--text:#e2e8f0;--muted:#94a3b8;--success:#10b981;--danger:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:20px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.header h1{font-size:22px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .user-info{display:flex;align-items:center;gap:12px;font-size:14px}
.tabs{display:flex;gap:4px;padding:0 30px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:14px 20px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:30px;max-width:1200px;margin:0 auto}
.page.active{display:block}
.crypto-layout{display:grid;grid-template-columns:180px 1fr;gap:20px}
.algo-list{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px}
.algo-item{padding:12px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s;margin-bottom:4px}
.algo-item:hover{background:rgba(99,102,241,.1)}
.algo-item.active{background:var(--accent);color:#fff}
.workspace{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
.workspace h3{font-size:16px;margin-bottom:16px}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.input-group textarea,.input-group input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:14px;font-family:'Consolas','Monaco',monospace;resize:vertical;outline:none}
.input-group textarea:focus,.input-group input:focus{border-color:var(--accent)}
.input-group textarea{min-height:100px}
.btn-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:all .2s;font-weight:500}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#4f46e5}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.output-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;min-height:60px;font-family:'Consolas','Monaco',monospace;font-size:13px;word-break:break-all;white-space:pre-wrap;color:var(--success)}
.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.game-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.game-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.game-card .icon{font-size:48px;margin-bottom:12px}
.game-card h3{font-size:18px;margin-bottom:8px}
.game-card p{font-size:13px;color:var(--muted)}
.game-container{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
#snakeCanvas,#mineCanvas{background:#000;border-radius:8px;display:block;margin:0 auto}
#game2048{display:grid;grid-template-columns:repeat(4,80px);gap:8px;justify-content:center;margin:20px auto;width:fit-content}
.cell2048{width:80px;height:80px;background:var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold}
.score-display{font-size:18px;margin-bottom:12px;color:var(--accent)}
.auth-form{max-width:400px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px}
.auth-form h2{margin-bottom:20px;text-align:center}
.echo-list{margin-top:20px}
.echo-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.echo-item .meta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.echo-item .content{font-size:14px;line-height:1.6}
.echo-item img{max-width:100%;border-radius:8px;margin-top:8px}
.file-list{margin-top:20px}
.file-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.file-item .name{font-size:14px}
.file-item .size{font-size:12px;color:var(--muted)}
.storage-bar{background:var(--border);border-radius:100px;height:8px;margin:12px 0;overflow:hidden}
.storage-fill{background:var(--accent);height:100%;transition:width .3s}
.admin-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.admin-section h3{margin-bottom:16px;color:var(--accent2)}
.pending-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;z-index:9999;animation:slideIn .3s}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal-content h2{margin-bottom:20px}
.close-modal{float:right;cursor:pointer;font-size:20px;color:var(--muted)}
</style>
</head>
<body>

<div class="header">
  <h1>🧰 ToolBox 工具箱</h1>
  <div class="user-info" id="userInfo">
    <button class="btn btn-secondary btn-sm" onclick="showAuth('login')">登录</button>
    <button class="btn btn-primary btn-sm" onclick="showAuth('register')">注册</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('crypto')">🔐 加密工具</div>
  <div class="tab" onclick="switchTab('games')">🎮 小游戏</div>
  <div class="tab" onclick="switchTab('echo')">📢 回声洞</div>
  <div class="tab" onclick="switchTab('cloud')">☁️ 我的云盘</div>
  <div class="tab" onclick="switchTab('admin')">⚙️ 管理</div>
</div>

<!-- 加密工具 -->
<div class="page active" id="page-crypto">
  <div class="crypto-layout">
    <div class="algo-list">
      <div class="algo-item active" onclick="selectAlgo('md5')">MD5<div class="desc">不可逆哈希</div></div>
      <div class="algo-item" onclick="selectAlgo('sha256')">SHA-256<div class="desc">不可逆哈希</div></div>
      <div class="algo-item" onclick="selectAlgo('base64')">Base64<div class="desc">编码/解码</div></div>
      <div class="algo-item" onclick="selectAlgo('unicode')">Unicode<div class="desc">编码/解码</div></div>
      <div class="algo-item" onclick="selectAlgo('url')">URL编码<div class="desc">编码/解码</div></div>
      <div class="algo-item" onclick="selectAlgo('aes')">AES加密<div class="desc">需密钥</div></div>
    </div>
    <div class="workspace">
      <h3 id="algoTitle">MD5 哈希</h3>
      <div class="input-group">
        <label>输入内容</label>
        <textarea id="cryptoInput" placeholder="输入要处理的文本..."></textarea>
      </div>
      <div class="input-group" id="keyGroup" style="display:none">
        <label>密钥</label>
        <input type="text" id="cryptoKey" placeholder="输入加密密钥">
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="doCrypto('encode')">加密/编码</button>
        <button class="btn btn-secondary" id="decodeBtn" onclick="doCrypto('decode')" style="display:none">解密/解码</button>
        <button class="btn btn-secondary" onclick="copyOutput()">复制结果</button>
      </div>
      <div class="output-box" id="cryptoOutput">结果将显示在这里...</div>
    </div>
  </div>
</div>

<!-- 小游戏 -->
<div class="page" id="page-games">
  <div class="game-grid" id="gameList">
    <div class="game-card" onclick="openGame('snake')">
      <div class="icon">🐍</div>
      <h3>贪吃蛇</h3>
      <p>经典贪吃蛇，方向键控制</p>
    </div>
    <div class="game-card" onclick="openGame('2048')">
      <div class="icon">🔢</div>
      <h3>2048</h3>
      <p>合并数字到2048</p>
    </div>
    <div class="game-card" onclick="openGame('mine')">
      <div class="icon">💣</div>
      <h3>扫雷</h3>
      <p>找出所有地雷</p>
    </div>
  </div>
  <div class="game-container" id="gameContainer" style="display:none">
    <button class="btn btn-secondary btn-sm" onclick="closeGame()" style="float:right">返回</button>
    <div id="gameArea"></div>
  </div>
</div>

<!-- 回声洞 -->
<div class="page" id="page-echo">
  <div class="workspace">
    <h3>📢 回声洞 - 匿名分享</h3>
    <div class="input-group">
      <textarea id="echoText" placeholder="说点什么吧..." style="min-height:80px"></textarea>
    </div>
    <div class="input-group">
      <label>上传图片（可选）</label>
      <input type="file" id="echoImage" accept="image/*">
    </div>
    <button class="btn btn-primary" onclick="postEcho()">发布</button>
  </div>
  <div class="echo-list" id="echoList"></div>
</div>

<!-- 云盘 -->
<div class="page" id="page-cloud">
  <div class="workspace">
    <h3>☁️ 我的云盘 <span style="font-size:12px;color:var(--muted)">每人10MB</span></h3>
    <div class="storage-bar"><div class="storage-fill" id="storageFill" style="width:0%"></div></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px" id="storageText">0 MB / 10 MB</div>
    <input type="file" id="fileInput">
    <button class="btn btn-primary" onclick="uploadFile()" style="margin-top:10px">上传文件</button>
  </div>
  <div class="file-list" id="fileList"></div>
</div>

<!-- 管理 -->
<div class="page" id="page-admin">
  <div id="adminLogin" style="text-align:center;padding:40px">
    <h3>管理员登录</h3>
    <p style="color:var(--muted);margin:16px 0">需要管理员权限</p>
    <input type="password" id="adminPass" placeholder="管理员密码" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
    <button class="btn btn-primary" onclick="adminLogin()" style="margin-left:8px">登录</button>
  </div>
  <div id="adminPanel" style="display:none">
    <div class="admin-section">
      <h3>⏳ 待审核回声</h3>
      <div id="pendingList"></div>
    </div>
  </div>
</div>

<!-- 登录/注册弹窗 -->
<div class="modal" id="authModal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('authModal')">&times;</span>
    <h2 id="authTitle">登录</h2>
    <div class="input-group">
      <label>用户名</label>
      <input type="text" id="authUsername">
    </div>
    <div class="input-group">
      <label>密码</label>
      <input type="password" id="authPassword">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="doAuth()">确认</button>
  </div>
</div>

<script>
// Supabase 配置
const SUPABASE_URL = 'https://gxaiupkrxgumaqirrlth.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4YWl1cGtyeGd1bWFxaXJybHRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1MzQwMDAsImV4cCI6MjA3ODEwMDAwMH0.placeholder';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentAlgo = 'md5';

// 初始化
async function init() {
  // 检查登录状态
  const saved = localStorage.getItem('scp_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    updateUserUI();
  }
  loadEchoes();
  if (currentUser) loadFiles();
}

// Toast提示
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// 标签切换
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'echo') loadEchoes();
  if (name === 'cloud' && currentUser) loadFiles();
  if (name === 'games') closeGame();
}

// ========== 加密工具 ==========
function selectAlgo(algo) {
  currentAlgo = algo;
  document.querySelectorAll('.algo-item').forEach(i => i.classList.remove('active'));
  event.target.closest('.algo-item').classList.add('active');
  const titles = {md5:'MD5 哈希',sha256:'SHA-256 哈希',base64:'Base64 编解码',unicode:'Unicode 编解码',url:'URL 编解码',aes:'AES 加解密'};
  document.getElementById('algoTitle').textContent = titles[algo];
  document.getElementById('keyGroup').style.display = algo === 'aes' ? 'block' : 'none';
  document.getElementById('decodeBtn').style.display = (algo === 'base64' || algo === 'unicode' || algo === 'url' || algo === 'aes') ? 'inline-block' : 'none';
}

function doCrypto(mode) {
  const input = document.getElementById('cryptoInput').value;
  const key = document.getElementById('cryptoKey').value;
  let output = '';
  try {
    switch(currentAlgo) {
      case 'md5': output = CryptoJS.MD5(input).toString(); break;
      case 'sha256': output = CryptoJS.SHA256(input).toString(); break;
      case 'base64': output = mode === 'encode' ? btoa(unescape(encodeURIComponent(input))) : decodeURIComponent(escape(atob(input))); break;
      case 'unicode': output = mode === 'encode' ? input.split('').map(c => '\\u' + c.charCodeAt(0).toString(16).padStart(4,'0')).join('') : input.replace(/\\u([0-9a-fA-F]{4})/g, (_,h) => String.fromCharCode(parseInt(h,16))); break;
      case 'url': output = mode === 'encode' ? encodeURIComponent(input) : decodeURIComponent(input); break;
      case 'aes':
        if (!key) { toast('请输入密钥', 'error'); return; }
        output = mode === 'encode' ? CryptoJS.AES.encrypt(input, key).toString() : CryptoJS.AES.decrypt(input, key).toString(CryptoJS.enc.Utf8);
        break;
    }
    document.getElementById('cryptoOutput').textContent = output;
  } catch(e) {
    document.getElementById('cryptoOutput').textContent = '错误: ' + e.message;
  }
}

function copyOutput() {
  const text = document.getElementById('cryptoOutput').textContent;
  navigator.clipboard.writeText(text);
  toast('已复制');
}

// ========== 用户系统 ==========
let authMode = 'login';
function showAuth(mode) {
  authMode = mode;
  document.getElementById('authTitle').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('authModal').classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

async function doAuth() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!username || !password) { toast('请填写完整', 'error'); return; }
  const hash = CryptoJS.SHA256(password).toString();
  
  if (authMode === 'register') {
    const { data, error } = await supabase.from('users').insert([{ username, password: hash }]);
    if (error) { toast('用户名已存在', 'error'); return; }
    toast('注册成功，请登录');
    closeModal('authModal');
  } else {
    const { data, error } = await supabase.from('users').select('*').eq('username', username).eq('password', hash);
    if (error || !data.length) { toast('用户名或密码错误', 'error'); return; }
    currentUser = data[0];
    localStorage.setItem('scp_user', JSON.stringify(currentUser));
    updateUserUI();
    closeModal('authModal');
    toast('登录成功');
    loadFiles();
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem('scp_user');
  updateUserUI();
  toast('已退出');
}

function updateUserUI() {
  const el = document.getElementById('userInfo');
  if (currentUser) {
    el.innerHTML = `<span>👤 ${currentUser.username}</span><button class="btn btn-secondary btn-sm" onclick="logout()">退出</button>`;
  } else {
    el.innerHTML = `<button class="btn btn-secondary btn-sm" onclick="showAuth('login')">登录</button><button class="btn btn-primary btn-sm" onclick="showAuth('register')">注册</button>`;
  }
}

// ========== 回声洞 ==========
async function loadEchoes() {
  const { data, error } = await supabase.from('echoes').select('*').eq('status', 'approved').order('id', { ascending: false }).limit(100);
  const list = document.getElementById('echoList');
  if (error || !data.length) { list.innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px">还没有内容，来发布第一条吧！</p>'; return; }
  list.innerHTML = data.map(e => `
    <div class="echo-item">
      <div class="meta"><span>👤 ${e.username || '匿名'}</span><span>${e.time}</span></div>
      <div class="content">${e.text || ''}</div>
      ${e.image ? `<img src="${e.image}" alt="图片">` : ''}
    </div>
  `).join('');
}

async function postEcho() {
  if (!currentUser) { toast('请先登录', 'error'); showAuth('login'); return; }
  const text = document.getElementById('echoText').value.trim();
  const imgFile = document.getElementById('echoImage').files[0];
  if (!text && !imgFile) { toast('内容不能为空', 'error'); return; }
  
  let imageUrl = null;
  if (imgFile) {
    const ext = imgFile.name.split('.').pop();
    const path = `echoes/${Date.now()}-${Math.random().toString(36).substr(2,8)}.${ext}`;
    const { error } = await supabase.storage.from('uploads').upload(path, imgFile);
    if (!error) {
      const { data } = supabase.storage.from('uploads').getPublicUrl(path);
      imageUrl = data.publicUrl;
    }
  }
  
  const time = new Date().toLocaleString('zh-CN');
  const { error } = await supabase.from('echoes').insert([{ text, image: imageUrl, username: currentUser.username, time, status: 'pending' }]);
  if (error) { toast('发布失败', 'error'); return; }
  toast('发布成功，等待审核');
  document.getElementById('echoText').value = '';
  document.getElementById('echoImage').value = '';
}

// ========== 云盘 ==========
const STORAGE_LIMIT = 10 * 1024 * 1024;

async function loadFiles() {
  if (!currentUser) return;
  const { data, error } = await supabase.from('files').select('*').eq('user_id', currentUser.id).order('id', { ascending: false });
  const list = document.getElementById('fileList');
  if (error || !data.length) { list.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px">还没有文件</p>'; }
  else {
    list.innerHTML = data.map(f => `
      <div class="file-item">
        <div><div class="name">📄 ${f.filename}</div><div class="size">${(f.filesize/1024).toFixed(1)} KB</div></div>
        <div>
          <button class="btn btn-primary btn-sm" onclick="downloadFile(${f.id}, '${f.filename}')">下载</button>
          <button class="btn btn-danger btn-sm" onclick="deleteFile(${f.id})">删除</button>
        </div>
      </div>
    `).join('');
  }
  // 计算已用空间
  const used = data ? data.reduce((s, f) => s + Number(f.filesize), 0) : 0;
  document.getElementById('storageFill').style.width = (used / STORAGE_LIMIT * 100) + '%';
  document.getElementById('storageText').textContent = (used / 1024 / 1024).toFixed(2) + ' MB / 10 MB';
}

async function uploadFile() {
  if (!currentUser) { toast('请先登录', 'error'); showAuth('login'); return; }
  const file = document.getElementById('fileInput').files[0];
  if (!file) { toast('请选择文件', 'error'); return; }
  if (file.size > STORAGE_LIMIT) { toast('文件超过10MB', 'error'); return; }
  
  const path = `userfiles/${currentUser.id}/${Date.now()}-${file.name}`;
  const { error: uploadError } = await supabase.storage.from('uploads').upload(path, file);
  if (uploadError) { toast('上传失败', 'error'); return; }
  
  const { data } = supabase.storage.from('uploads').getPublicUrl(path);
  await supabase.from('files').insert([{ user_id: currentUser.id, filename: file.name, filesize: file.size, filetype: file.type, stored_name: path }]);
  toast('上传成功');
  document.getElementById('fileInput').value = '';
  loadFiles();
}

async function downloadFile(id, filename) {
  const { data } = await supabase.from('files').select('*').eq('id', id).single();
  if (!data) return;
  const { data: { publicUrl } } = supabase.storage.from('uploads').getPublicUrl(data.stored_name);
  const a = document.createElement('a');
  a.href = publicUrl;
  a.download = filename;
  a.click();
}

async function deleteFile(id) {
  const { data } = await supabase.from('files').select('*').eq('id', id).single();
  if (data) {
    await supabase.storage.from('uploads').remove([data.stored_name]);
    await supabase.from('files').delete().eq('id', id);
  }
  toast('已删除');
  loadFiles();
}

// ========== 管理员 ==========
function adminLogin() {
  const pass = document.getElementById('adminPass').value;
  if (pass === '520520') {
    document.getElementById('adminLogin').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';

  }

async function loadPending() {
  const { data, error } = await supabase.from('echoes').select('*').eq('status', 'pending').order('id', { ascending: false });
  const list = document.getElementById('pendingList');
  if (error || !data.length) { list.innerHTML = '<p style="color:var(--muted)">没有待审核内容</p>'; return; }
  list.innerHTML = data.map(e => `
    <div class="pending-item">
      <div class="meta"><span>${e.username}</span><span>${e.time}</span></div>
      <div style="margin:8px 0">${e.text || ''}</div>
      ${e.image ? `<img src="${e.image}" style="max-width:200px;border-radius:8px">` : ''}
      <div style="margin-top:8px">
        <button class="btn btn-success btn-sm" onclick="approveEcho(${e.id})">通过</button>
        <button class="btn btn-danger btn-sm" onclick="deleteEcho(${e.id})">删除</button>
      </div>
    </div>
  `).join('');
}

async function approveEcho(id) {
  await supabase.from('echoes').update({ status: 'approved' }).eq('id', id);
  toast('已通过');
  loadPending();
}

async function deleteEcho(id) {
  const { data } = await supabase.from('echoes').select('*').eq('id', id).single();
  if (data?.image) {
    const path = data.image.split('/uploads/')[1];
    if (path) await supabase.storage.from('uploads').remove([path]);
  }
  await supabase.from('echoes').delete().eq('id', id);
  toast('已删除');
  loadPending();
}

// ========== 小游戏 ==========
function openGame(game) {
  document.getElementById('gameList').style.display = 'none';
  document.getElementById('gameContainer').style.display = 'block';
  const area = document.getElementById('gameArea');
  if (game === 'snake') initSnake(area);
  if (game === '2048') init2048(area);
  if (game === 'mine') initMine(area);
}

function closeGame() {
  document.getElementById('gameList').style.display = 'grid';
  document.getElementById('gameContainer').style.display = 'none';

}

// 贪吃蛇
function initSnake(area) {
  area.innerHTML = '<div class="score-display">分数: <span id="snakeScore">0</span></div><canvas id="snakeCanvas" width="400" height="400"></canvas>';
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  let snake = [{x:10,y:10}], food = {x:15,y:15}, dir = {x:1,y:0}, score = 0, gameLoop;
  
  function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,400,400);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(food.x*20, food.y*20, 18, 18);
    ctx.fillStyle = '#10b981';
    snake.forEach(s => ctx.fillRect(s.x*20, s.y*20, 18, 18));
  }
  
  function update() {
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x===head.x && s.y===head.y)) {
      clearInterval(gameLoop);
      toast('游戏结束！分数: ' + score);
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      document.getElementById('snakeScore').textContent = score;
      food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
    } else snake.pop();
    draw();
  }
  
  document.onkeydown = (e) => {
    if (e.key === 'ArrowUp' && dir.y !== 1) dir = {x:0,y:-1};
    if (e.key === 'ArrowDown' && dir.y !== -1) dir = {x:0,y:1};
    if (e.key === 'ArrowLeft' && dir.x !== 1) dir = {x:-1,y:0};
    if (e.key === 'ArrowRight' && dir.x !== -1) dir = {x:1,y:0};
  };
  
  draw();
  gameLoop = setInterval(update, 200);
}

// 2048
function init2048(area) {
  area.innerHTML = '<div class="score-display">分数: <span id="score2048">0</span></div><div id="game2048"></div>';
  let grid = Array(4).fill(null).map(() => Array(4).fill(0));
  let score = 0;
  
  function addTile() {
    const empty = [];
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if (!grid[i][j]) empty.push([i,j]);
    if (!empty.length) return;
    const [r,c] = empty[Math.floor(Math.random()*empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }
  
  function render() {
    const colors = {2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
    document.getElementById('game2048').innerHTML = grid.flat().map(v => 
      `<div class="cell2048" style="background:${colors[v]||'#2a2a4a'};color:${v>4?'#fff':'#776e65'}">${v||''}</div>`
    ).join('');
    document.getElementById('score2048').textContent = score;
  }
  
  function move(dir) {
    let moved = false;
    const rotate = (g) => g[0].map((_,i) => g.map(row => row[i]).reverse());
    if (dir === 'up') grid = rotate(rotate(rotate(grid)));
    if (dir === 'down') grid = rotate(grid);
    if (dir === 'right') grid = rotate(rotate(grid));
    
    for (let i = 0; i < 4; i++) {
      let row = grid[i].filter(x => x);
      for (let j = 0; j < row.length - 1; j++) {
        if (row[j] === row[j+1]) { row[j] *= 2; score += row[j]; row.splice(j+1, 1); moved = true; }
      }
      while (row.length < 4) row.push(0);
      if (grid[i].join() !== row.join()) moved = true;
      grid[i] = row;
    }
    
    if (dir === 'up') grid = rotate(grid);
    if (dir === 'down') grid = rotate(rotate(rotate(grid)));
    if (dir === 'right') grid = rotate(rotate(grid));
    
    if (moved) { addTile(); render(); }
  }
  
  document.onkeydown = (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      move(e.key.replace('Arrow','').toLowerCase());
    }
  };
  
  addTile(); addTile(); render();
}

// 扫雷
function initMine(area) {
  area.innerHTML = '<div class="score-display">剩余雷数: <span id="mineCount">10</span></div><canvas id="mineCanvas" width="300" height="300"></canvas>';
  const canvas = document.getElementById('mineCanvas');
  const ctx = canvas.getContext('2d');
  const SIZE = 10, MINES = 10;
  let grid = [], revealed = [], flagged = [], gameOver = false;
  
  for (let i = 0; i < SIZE; i++) {
    grid[i] = []; revealed[i] = []; flagged[i] = [];
    for (let j = 0; j < SIZE; j++) { grid[i][j] = 0; revealed[i][j] = false; flagged[i][j] = false; }
  }
  
  let placed = 0;
  while (placed < MINES) {
    const r = Math.floor(Math.random()*SIZE), c = Math.floor(Math.random()*SIZE);
    if (grid[r][c] !== -1) { grid[r][c] = -1; placed++; }
  }
  
  for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) {
    if (grid[i][j] === -1) continue;
    let count = 0;
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
      const ni = i+di, nj = j+dj;
      if (ni >= 0 && ni < SIZE && nj >= 0 && nj < SIZE && grid[ni][nj] === -1) count++;
    }
    grid[i][j] = count;
  }
  
  function draw() {
    ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,300,300);
    for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) {
      const x = j*30, y = i*30;
      ctx.strokeStyle = '#2a2a4a'; ctx.strokeRect(x,y,30,30);
      if (revealed[i][j]) {
        ctx.fillStyle = '#0f0f1a'; ctx.fillRect(x+1,y+1,28,28);
        if (grid[i][j] === -1) { ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(x+15,y+15,8,0,Math.PI*2); ctx.fill(); }
        else if (grid[i][j] > 0) { ctx.fillStyle = '#6366f1'; ctx.font = '16px Arial'; ctx.fillText(grid[i][j], x+10, y+20); }
      } else if (flagged[i][j]) {
        ctx.fillStyle = '#f59e0b'; ctx.font = '18px Arial'; ctx.fillText('🚩', x+6, y+22);
      }
    }
  }
  
  function reveal(r, c) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE || revealed[r][c] || flagged[r][c]) return;
    revealed[r][c] = true;
    if (grid[r][c] === -1) { gameOver = true; toast('踩到雷了！游戏结束', 'error'); return; }
    if (grid[r][c] === 0) {
      for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) reveal(r+di, c+dj);
    }
  }
  
  canvas.onclick = (e) => {
    if (gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / 30), r = Math.floor((e.clientY - rect.top) / 30);
    reveal(r, c);
    draw();
  };
  
  canvas.oncontextmenu = (e) => {
    e.preventDefault();
    if (gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / 30), r = Math.floor((e.clientY - rect.top) / 30);
    if (!revealed[r][c]) flagged[r][c] = !flagged[r][c];
    draw();
  };
  
  draw();
}

init();
